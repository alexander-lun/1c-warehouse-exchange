openapi: 3.0.3
info:
  title: API склада
  version: 1.1.0
  description: |
    HTTP-сервис APIСклада конфигурации «Склад: обмен с маркетплейсом».
    Базовый адрес: `http://<сервер>/<публикация>/hs/api`.

    Все методы требуют заголовок `X-Api-Key` со значением константы «Токен доступа к API склада».
    Заголовок `Authorization` не используется: его забирает веб-модуль 1С для аутентификации пользователей базы.

    Ошибки возвращаются в виде `{"error": "текст"}`.
servers:
  - url: http://127.0.0.1:8081/warehouse/hs/api
security:
  - ApiKey: []

paths:
  /stock:
    get:
      summary: Остатки всех товаров
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /stock/{sku}:
    get:
      summary: Остаток товара по артикулу с разбивкой по ячейкам
      description: Для ТСД - где лежит товар. `ПРИЕМКА` - зона приемки (товар еще не размещен).
      parameters:
        - { name: sku, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StockItem"
                  - type: object
                    properties:
                      cells:
                        type: array
                        items: { $ref: "#/components/schemas/CellQuantity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /receipts:
    post:
      summary: Поступление товаров
      description: |
        Создает и проводит документ «Поступление товаров».
        Товар ищется по артикулу; если его нет, он создается — тогда обязательно `name`.
        Поступление создается целиком или не создается вовсе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string }
                      name: { type: string, description: "Обязательно для нового товара" }
                      quantity: { type: number, minimum: 0, exclusiveMinimum: true }
            example:
              items:
                - { sku: ART-001, name: "Кабель ВВГнг 3х2,5", quantity: 100 }
      responses:
        "201":
          description: Поступление создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: string }
                  date: { type: string, format: date-time }
                  items: { type: integer, description: Количество строк }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Error" }

  /orders:
    get:
      summary: Заказы маркетплейса
      description: Последние заказы по убыванию даты.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/OrderHeader" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /orders/{id}:
    get:
      summary: Заказ по идентификатору маркетплейса
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /orders/{id}/status:
    put:
      summary: Смена статуса заказа
      description: |
        Перепроводит заказ и передает новый статус на маркетплейс.
        Отмененный заказ снимает резерв. Из статусов delivered и cancelled заказ не переводится.
        Ошибки передачи на маркетплейс не откатывают смену статуса — они возвращаются в `marketplace_errors`,
        а статус ставится в очередь повторной отправки.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Order"
                  - type: object
                    properties:
                      marketplace_errors: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422":
          description: Заказ не удалось провести (например, не хватает товара)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /exchange/{operation}:
    post:
      summary: Ручной запуск обмена с маркетплейсом
      description: |
        `pull-orders` — загрузка новых и измененных заказов, `push-stock` — выгрузка остатков,
        `push-statuses` — повторная отправка статусов, которые не удалось передать раньше.
        То же самое по расписанию делает регламентное задание «Загрузка заказов маркетплейса».
      parameters:
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [pull-orders, push-stock, push-statuses] }
      responses:
        "200":
          description: Результат обмена (ошибки по отдельным заказам не прерывают обмен)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /cells:
    post:
      summary: Загрузка ячеек склада
      description: Создает ячейки или обновляет порядок обхода существующих (ячейка ищется по адресу).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cells]
              properties:
                cells:
                  type: array
                  items:
                    type: object
                    required: [address]
                    properties:
                      address: { type: string, example: A-01-02 }
                      route_order: { type: integer, description: Порядок обхода ячеек при сборке }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /placements:
    post:
      summary: Размещение товара по ячейкам
      description: |
        Создает и проводит документ «Размещение товаров».
        С телом `items` - перемещает указанное количество между ячейками.
        Без тела - размещает все из зоны приемки: товар кладется в ячейку, где он уже хранится,
        новый товар - в первую свободную ячейку по порядку обхода.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/Placement" }
      responses:
        "201":
          description: Документ проведен
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/Placement" } }
                  errors: { type: array, items: { type: string }, description: "Товары, для которых не нашлось ячейки" }
        "200": { description: В зоне приемки нет товара }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: В ячейке-отправителе не хватает товара
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/pick:
    post:
      summary: Отбор товаров по заказу
      description: |
        Создает и проводит документ «Отбор товаров»: товар списывается из ячеек хранения в порядке обхода.
        Заказ должен быть проведен и находиться в статусе `awaiting_packaging`. Заказ отбирается один раз.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Отбор проведен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Заказ уже отобран }
        "422":
          description: Не хватает товара в ячейках хранения или заказ в неподходящем статусе
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/pick-list:
    get:
      summary: Лист отбора по заказу
      description: Печатная форма «Лист отбора» в PDF; с `format=json` - те же строки в JSON.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [pdf, json], default: pdf } }
      responses:
        "200":
          description: OK
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/PickList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }

  /reports/turnover:
    get:
      summary: Оборачиваемость товаров за период
      description: |
        Те же показатели, что в отчете «Оборачиваемость товаров» (одна схема компоновки данных).
        Средний остаток - среднее остатков на начало и конец периода.
        Оборачиваемость = средний остаток × дней / продано; запаса хватит = остаток на конец × дней / продано.
        Для товаров без продаж оба показателя - `null`.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: По умолчанию - начало месяца }
        - { name: to, in: query, schema: { type: string, format: date }, description: По умолчанию - сегодня }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        name: { type: string }
                        opening: { type: number }
                        sold: { type: number }
                        closing: { type: number }
                        average: { type: number }
                        turnover_days: { type: number, nullable: true }
                        cover_days: { type: number, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  responses:
    Unauthorized:
      description: Нет или неверный ключ API
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Status:
      type: string
      enum: [new, awaiting_packaging, delivering, delivered, cancelled]

    StockItem:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        quantity: { type: number }

    OrderHeader:
      type: object
      properties:
        id: { type: string, description: Идентификатор заказа на маркетплейсе }
        number: { type: string, description: Номер документа в 1С }
        date: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/Status" }
        amount: { type: number }
        posted: { type: boolean, description: "false — заказ сохранен, но не проведен (не хватило товара)" }

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderHeader"
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  sku: { type: string }
                  name: { type: string }
                  quantity: { type: number }
                  price: { type: number }
                  amount: { type: number }

    ExchangeResult:
      type: object
      properties:
        success: { type: boolean }
        processed: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors: { type: array, items: { type: string } }

    CellQuantity:
      type: object
      properties:
        cell: { type: string }
        quantity: { type: number }

    Placement:
      type: object
      required: [sku, from, to, quantity]
      properties:
        sku: { type: string }
        from: { type: string, description: Адрес ячейки-отправителя }
        to: { type: string, description: Адрес ячейки-получателя }
        quantity: { type: number }

    PickList:
      type: object
      properties:
        number: { type: string, description: Номер документа «Отбор товаров» }
        order_id: { type: string }
        items:
          type: array
          description: Строки в порядке обхода ячеек
          items:
            type: object
            properties:
              cell: { type: string }
              sku: { type: string }
              name: { type: string }
              quantity: { type: number }
